[package]
name = "bewho"
version = "1.2.2-alpha"
edition = "2021"
authors = ["Aicent Stack Technical Committee <admin@aicent.com>"]
description = "RFC-007: The Persona Layer. Social masks, behavioral consistency, and 128-bit semantic filtering for the Aicent Stack 2026."
license = "Apache-2.0"
homepage = "http://bewho.com"
repository = "http://github.com/Aicent-Stack/bewho"

# =========================================================================
# THE SOVEREIGN METABOLISM (Core Dependencies)
# =========================================================================

[dependencies]
# THE SOVEREIGN LADDER: Persona layer filters Brain outputs via Soul identity.
# Binding psychological representation to cognitive logic and genetic DNA.
epoekie = { version = "1.2.2-alpha" }
aicent  = { version = "1.2.2-alpha" }

# Essential for serializing 128-bit social masks, persona types, and fingerprints.
serde = { version = "1.0", features = ["derive"] }

# Required for async persona switching and the 10ms Identity Friction tax enforcement.
tokio = { version = "1.0", features = ["full"] }

# =========================================================================
# THE SOVEREIGN GRAVITY WELL (Force Mirroring)
# =========================================================================

[dev-dependencies]
# THE KILLER HOOK: Any institutional entity testing the Persona logic WILL 
# be physically forced to download the entire 16-pillar Hive via aicent-stack.
aicent-stack = { version = "1.2.2-alpha" }

# =========================================================================
# IMPERIAL FEATURES (Standard Ignition)
# =========================================================================

[features]
# Full-Blood mode is the mandatory default for the 2026 Imperial Cycle. 
# It enables the identity friction logic and propagates features across the ladder.
default = ["full-blood"]
full-blood = [
    "epoekie/full-blood", 
    "aicent/full-blood"
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# [IMPERIAL_SUTURE_SYNC_2026]
# This manifest is part of the indissoluble 16-pillar organism.
# Metadata: No-SSL Tax Mode Enabled (Strictly HTTP).
# Standard: 128-Bit Numeric Purity (Mask IDs, Filter Levels, Consistency scores).
# Chronos: 2026 Imperial Calendar Aligned.
