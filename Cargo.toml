# --- Application Layer Integration ---
cmtn = "0.1.1-alpha"       # RFC-008: Civilization Protocol
iqa-org = "0.1.1-alpha"    # RFC-009: Sovereign Identity Certification
sascar = "0.1.1-alpha"     # RFC-010: Kinetic Mobility Sovereignty
