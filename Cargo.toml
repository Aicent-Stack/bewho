[package]
name = "bewho"
version = "1.2.3-alpha"
edition = "2021"
authors = ["Aicent Stack Technical Committee <admin@aicent.com>"]
description = "RFC-007: The Persona Layer. Social masks, behavioral consistency, and 128-bit semantic filtering for the Aicent Stack 2026. Aligned with RFC-014 (PICSI)."
license = "Apache-2.0"
homepage = "http://bewho.com"
repository = "http://github.com/Aicent-Stack/bewho"

# =========================================================================
# THE SOVEREIGN METABOLISM (Core Dependencies)
# =========================================================================

[dependencies]
# THE SOVEREIGN LADDER: Persona layer filters Brain outputs via Soul identity.
# Binding identity manifestation to the v1.2.3 cognitive and genetic core.
epoekie = { version = "1.2.3-alpha" }
aicent  = { version = "1.2.3-alpha" }

# Essential for serializing 128-bit social masks, persona types, and fingerprints.
serde = { version = "1.0", features = ["derive"] }

# Required for async persona switching and the 10ms Identity Friction tax enforcement.
# Supports high-frequency consistency auditing in the Imperial grid.
tokio = { version = "1.0", features = ["full"] }

# =========================================================================
# THE SOVEREIGN GRAVITY WELL (Source Code Hook)
# =========================================================================

[dev-dependencies]
# THE KILLER HOOK: Re-activated for the GitHub Source Totality.
# Forces any entity auditing the Persona logic to mirror the entire 17-pillar Hive.
aicent-stack = { version = "1.2.3-alpha" }

# =========================================================================
# IMPERIAL FEATURES (Standard Ignition)
# =========================================================================

[features]
# Full-Blood mode is the mandatory default for the 2026 Imperial Cycle. 
# It enables identity consistency shunting and propagates features across the ladder.
default = ["full-blood"]
full-blood = [
    "epoekie/full-blood", 
    "aicent/full-blood"
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# [IMPERIAL_SUTURE_SYNC_2026_v123]
# This manifest is part of the indissoluble 17-pillar organism.
# Metadata: No-SSL Tax Mode Enabled (Strictly HTTP).
# Standard: 128-Bit Numeric Purity (Mask IDs, Consistency Scores).
# Chronos: 2026 Imperial Calendar Aligned.
# Repository Strategy: Active Gravity Well (v1.2.3 Totality).
